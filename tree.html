  <style>
    /* ── RESET & TOKENS ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --md-gold:        #F0A500;
      --md-gold-light:  #FEF3D0;
      --md-gold-dim:    #B87D00;
      --md-red:         #CE1126;
      --md-red-light:   #FCEAEC;
      --md-black:       #111111;
      --md-navy:        #0F1B2D;
      --md-white:       #F7F4EE;

      --bg:           #F7F4EE;
      --bg2:          #EDE9E0;
      --fg:           #111111;
      --fg2:          #4A4035;
      --accent:       #B87D00;
      --accent-light: #FEF3D0;
      --cta:          #CE1126;
      --cta-hover:    #A50D1E;
      --border:       #D5CEBC;
      --card:         #FFFFFF;

      --serif: 'DM Serif Display', Georgia, serif;
      --sans:  'Plus Jakarta Sans', system-ui, sans-serif;
      --mono:  'DM Mono', 'Courier New', monospace;
      --nav-h: 60px;
      --px: 20px;
      --section-py: 72px;
    }
    [data-dark="true"] {
      --bg:           #0F1B2D;
      --bg2:          #162236;
      --fg:           #F7F4EE;
      --fg2:          #C8B99A;
      --accent:       #F0A500;
      --accent-light: #2A1F00;
      --cta:          #CE1126;
      --cta-hover:    #E8253D;
      --border:       #243450;
      --card:         #162236;
    }

    /* ── ACCESSIBILITY ──────────────────────────────────────── */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: absolute; top: -999px; left: 16px;
      background: var(--accent); color: white;
      padding: 10px 20px; border-radius: 0 0 4px 4px;
      font-size: 0.88rem; font-weight: 600; z-index: 9999;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; }
    .btn-primary:focus-visible,
    .btn-secondary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    :focus:not(:focus-visible) { outline: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
    }

    /* ── BASE ───────────────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    body {
      font-family: var(--sans);
      background: var(--bg); color: var(--fg);
      transition: background 0.3s, color 0.3s;
      line-height: 1.6; overflow-x: hidden;
    }
    ::selection { background: var(--accent); color: white; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── NAV ────────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--px);
      background: var(--bg);
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }
    nav.scrolled { border-color: var(--md-gold); box-shadow: 0 1px 20px rgba(0,0,0,0.06); border-bottom-width: 2px; }
    .nav-logo { font-family: var(--serif); font-size: 1.05rem; letter-spacing: -0.01em; transition: color 0.2s; }
    .nav-logo:hover { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .hamburger {
      display: flex; flex-direction: column; justify-content: center; gap: 5px;
      width: 44px; height: 44px; padding: 10px;
      background: none; border: none; cursor: pointer; border-radius: 4px;
    }
    .hamburger span {
      display: block; height: 2px; background: var(--fg);
      border-radius: 2px; transform-origin: center;
      transition: transform 0.25s, opacity 0.25s, width 0.25s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; width: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-drawer {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
      height: 100%; height: 100dvh;
      background: var(--bg);
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-flex-direction: column; flex-direction: column;
      visibility: hidden; opacity: 0; pointer-events: none;
      transition: opacity 0.22s ease, visibility 0s linear 0.22s, background 0.6s ease;
    }
    .nav-drawer.drawer-day {
      background: linear-gradient(180deg, #F7F4EE 0%, #EDE9E0 40%, #E2DDD3 75%, #D8D2C6 100%);
    }
    .nav-drawer.drawer-night {
      background: linear-gradient(180deg, #071525 0%, #0F1B2D 30%, #122038 65%, #162236 100%);
    }
    .nav-drawer.open {
      visibility: visible; opacity: 1; pointer-events: auto;
      transition: opacity 0.22s ease, visibility 0s linear 0s;
    }
    .nav-drawer-header {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-align-items: center; align-items: center;
      -webkit-justify-content: space-between; justify-content: space-between;
      padding: 0 var(--px); height: var(--nav-h); min-height: var(--nav-h);
      border-bottom: 2px solid var(--md-gold); -webkit-flex-shrink: 0; flex-shrink: 0;
      position: relative; z-index: 1;
    }
    .nav-drawer-logo { font-family: var(--serif); font-size: 1.05rem; color: var(--fg); }
    .nav-drawer-close {
      width: 44px; height: 44px; background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--fg); font-size: 1.4rem; line-height: 1; padding: 0;
    }
    .nav-drawer-inner {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-flex-direction: column; flex-direction: column;
      -webkit-flex: 1 1 auto; flex: 1 1 auto;
      min-height: 0; padding: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      position: relative; z-index: 1;
    }
    .nav-drawer a {
      font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--fg); padding: 0 var(--px); height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      transition: color 0.15s, background 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .nav-drawer a:active { color: var(--md-gold); background: rgba(240,165,0,0.07); }
    .nav-drawer-footer {
      padding: 20px var(--px); padding-bottom: max(20px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); -webkit-flex-shrink: 0; flex-shrink: 0;
      position: relative; z-index: 1;
    }
    .nav-drawer-mode {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; cursor: pointer; font-family: var(--sans);
      font-size: 0.88rem; font-weight: 600; color: var(--fg); width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-drawer-mode-label { display: flex; align-items: center; gap: 10px; }
    .nav-drawer-mode-icon {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--md-gold); opacity: 0.85;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; color: #111;
    }
    .nav-links { display: none; }
    .dark-toggle {
      background: none; border: 1.5px solid var(--border);
      border-radius: 99px; padding: 6px 12px;
      cursor: pointer; font-size: 0.76rem; font-weight: 500;
      color: var(--fg2); transition: all 0.2s; font-family: var(--sans); min-height: 36px;
    }
    .dark-toggle:hover { border-color: var(--accent); color: var(--accent); }

    /* ── SHARED SECTION STYLES ──────────────────────────────── */
    section { padding: var(--section-py) var(--px); }
    .section-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
    }
    .section-label::before {
      content: ''; display: inline-block; width: 20px; height: 1.5px;
      background: var(--accent); opacity: 0.7; flex-shrink: 0;
    }
    .section-title {
      font-family: var(--serif); font-size: clamp(1.8rem, 6vw, 3.4rem);
      line-height: 1.1; letter-spacing: -0.02em;
    }
    .section-title em { font-style: italic; color: var(--accent); }

    /* ── HERO ───────────────────────────────────────────────── */
    .hero {
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: calc(var(--nav-h) + 40px) var(--px) 56px;
      position: relative; overflow: hidden;
    }
    .hero-deco {
      position: absolute; top: 120px; right: -50px;
      width: min(200px, 48vw); height: min(200px, 48vw);
      pointer-events: none; opacity: 0.45; border-radius: 50%; overflow: hidden;
    }
    .hero-eyebrow {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 20px;
      animation: fadeUp 0.6s ease both; animation-delay: 0.1s;
    }
    .hero h1 { animation: fadeUp 0.7s ease both; animation-delay: 0.2s; }
    .hero-sub { animation: fadeUp 0.7s ease both; animation-delay: 0.35s; }
    .hero-ctas { animation: fadeUp 0.6s ease both; animation-delay: 0.5s; }
    .hero-stats { animation: fadeIn 0.8s ease both; animation-delay: 0.65s; }
    .hero h1 {
      font-family: var(--serif); font-size: clamp(2.6rem, 9vw, 6.8rem);
      line-height: 1.04; letter-spacing: -0.02em;
      text-wrap: balance; text-wrap: pretty;
    }
    .hero h1 em { font-style: italic; color: var(--accent); }
    .hero-sub { margin-top: 24px; font-size: 0.98rem; color: var(--fg2); line-height: 1.75; }
    .hero-ctas { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
    .hero-stats {
      margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr;
      gap: 24px 32px; padding-top: 36px; border-top: 1px solid var(--border);
    }
    .stat-num { font-family: var(--serif); font-size: 2rem; line-height: 1; }
    .stat-num span { color: var(--accent); }
    .hero-stats > div { position: relative; padding-bottom: 12px; }
    .hero-stats > div::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 24px; height: 1.5px;
      background: var(--accent); opacity: 0.45;
    }
    .stat-label {
      margin-top: 4px; font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.04em; color: var(--fg2); text-transform: uppercase;
    }

    /* ── BUTTONS ────────────────────────────────────────────── */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--cta); color: white; padding: 14px 24px; border-radius: 4px;
      font-size: 0.88rem; font-weight: 600; border: none; cursor: pointer;
      font-family: var(--sans); min-height: 44px;
      transition: background 0.2s, transform 0.2s; text-decoration: none;
    }
    .btn-primary:hover { background: var(--cta-hover); transform: translateY(-1px); }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center;
      background: none; color: var(--fg); padding: 14px 24px; border-radius: 4px;
      font-size: 0.88rem; font-weight: 500; border: 1.5px solid var(--border);
      cursor: pointer; font-family: var(--sans); min-height: 44px;
      transition: border-color 0.2s; text-decoration: none;
    }
    .btn-secondary:hover { border-color: var(--fg); }

    /* ── ABOUT ──────────────────────────────────────────────── */
    .about-grid {
      display: flex; flex-direction: column; align-items: center; gap: 40px; margin-top: 48px;
    }
    .about-photo { width: 180px; height: 180px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .about-text p { color: var(--fg2); line-height: 1.8; font-size: 0.97rem; margin-bottom: 18px; }
    .about-text p strong { color: var(--fg); font-weight: 600; }
    .about-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .tag {
      background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent);
      padding: 6px 12px; border-radius: 99px; font-size: 0.74rem; font-weight: 600;
    }

    /* ── SKILLS ─────────────────────────────────────────────── */
    .skills-section { background: var(--bg2); }
    .skills-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 48px; }
    .skill-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 4px; padding: 24px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .skill-card:hover {
      border-color: var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-2px);
    }
    .skill-card-title { font-weight: 600; font-size: 0.92rem; margin-bottom: 6px; }
    .skill-card-sub { font-size: 0.78rem; color: var(--fg2); line-height: 1.6; margin-bottom: 20px; }
    .skill-arc-wrap { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .skill-arc-svg { flex-shrink: 0; }
    .skill-arc-track { fill: none; stroke: var(--border); stroke-width: 3; stroke-linecap: round; }
    .skill-arc-fill {
      fill: none; stroke-width: 3; stroke-linecap: round;
      transition: stroke-dashoffset 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .skill-level {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent);
    }

    /* ── TOOL STACK (editorial replacement) ─────────────────── */
    .jtc-stack-wrap {
      margin-top: 48px;
    }

    /* Header row */
    .jtc-stack-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .jtc-stack-eyebrow {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--fg2);
      margin: 0 0 .4rem;
    }
    .jtc-stack-title {
      font-family: var(--serif);
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 400;
      line-height: 1;
      color: var(--fg);
      margin: 0;
    }
    .jtc-stack-title em {
      font-style: italic;
      color: var(--accent);
    }
    .jtc-count {
      font-family: var(--mono);
      font-size: 2.8rem;
      font-weight: 300;
      color: var(--border);
      line-height: 1;
      letter-spacing: -.05em;
      transition: color .3s ease;
    }

    /* Filter bar */
    .jtc-filters {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      list-style: none;
      padding: 0;
    }
    .jtc-filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: .25rem .7rem;
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--fg2);
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
      line-height: 1.6;
    }
    .jtc-filter-btn:hover {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
    }
    .jtc-filter-btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Grid */
    .jtc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    /* Card */
    .jtc-card {
      background: var(--card);
      padding: 1.25rem 1.1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      position: relative;
      overflow: hidden;
      cursor: default;
      animation: jtcFadeUp .4s cubic-bezier(.22,.68,0,1.2) both;
      transition: transform .18s cubic-bezier(.22,.68,0,1.2);
    }
    .jtc-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform .25s cubic-bezier(.22,.68,0,1.2);
      z-index: 0;
    }
    .jtc-card:hover::before { transform: scaleY(1); }
    .jtc-card:hover         { transform: translateY(-2px); }
    .jtc-card > * { position: relative; z-index: 1; }

    .jtc-cat {
      font-family: var(--mono);
      font-size: .56rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--fg2);
      transition: color .18s ease;
      margin: 0;
    }
    .jtc-name {
      font-family: var(--serif);
      font-size: 1.05rem;
      line-height: 1.2;
      color: var(--fg);
      transition: color .18s ease;
      margin: 0;
    }
    .jtc-card:hover .jtc-cat,
    .jtc-card:hover .jtc-name { color: #fff; }

    /* Badge */
    .jtc-card[data-badge]::after {
      content: attr(data-badge);
      position: absolute;
      top: .7rem; right: .7rem;
      font-family: var(--mono);
      font-size: .5rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      background: var(--accent);
      color: #fff;
      padding: .1rem .35rem;
      border-radius: 1px;
      z-index: 2;
      transition: opacity .2s ease;
    }
    .jtc-card[data-badge="new"]::after { background: var(--md-red); }
    .jtc-card[data-badge]:hover::after { opacity: 0; }

    /* Wide card */
    .jtc-card--wide {
      grid-column: span 2;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 1.25rem;
    }
    .jtc-card--wide .jtc-name { font-size: 1.25rem; }
    .jtc-arrow {
      font-size: 1.4rem;
      color: var(--border);
      transition: color .18s ease, transform .2s cubic-bezier(.22,.68,0,1.2);
      flex-shrink: 0;
      margin-left: 1rem;
    }
    .jtc-card--wide:hover .jtc-arrow {
      color: rgba(255,255,255,.5);
      transform: translateX(5px);
    }

    /* Hidden */
    .jtc-card--hidden { display: none !important; }

    /* Legend */
    .jtc-legend {
      margin-top: 1.5rem;
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      list-style: none;
      padding: 0;
    }
    .jtc-legend li {
      display: flex; align-items: center; gap: .35rem;
      font-family: var(--mono); font-size: .56rem;
      letter-spacing: .13em; text-transform: uppercase; color: var(--fg2);
    }
    .jtc-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }

    /* Entrance animation */
    @keyframes jtcFadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .jtc-card:nth-child(1)  { animation-delay: .03s; }
    .jtc-card:nth-child(2)  { animation-delay: .06s; }
    .jtc-card:nth-child(3)  { animation-delay: .09s; }
    .jtc-card:nth-child(4)  { animation-delay: .12s; }
    .jtc-card:nth-child(5)  { animation-delay: .15s; }
    .jtc-card:nth-child(6)  { animation-delay: .18s; }
    .jtc-card:nth-child(7)  { animation-delay: .21s; }
    .jtc-card:nth-child(8)  { animation-delay: .24s; }
    .jtc-card:nth-child(9)  { animation-delay: .27s; }
    .jtc-card:nth-child(10) { animation-delay: .30s; }
    .jtc-card:nth-child(11) { animation-delay: .33s; }
    .jtc-card:nth-child(12) { animation-delay: .36s; }
    .jtc-card:nth-child(13) { animation-delay: .39s; }
    .jtc-card:nth-child(14) { animation-delay: .42s; }
    .jtc-card:nth-child(15) { animation-delay: .45s; }

    @media (prefers-reduced-motion: reduce) {
      .jtc-card { animation: none; }
      .jtc-card::before { transition: none; }
    }
    @media (max-width: 540px) {
      .jtc-stack-header { grid-template-columns: 1fr; }
      .jtc-count { display: none; }
      .jtc-card--wide { grid-column: span 1; flex-direction: column; align-items: flex-start; }
      .jtc-arrow { display: none; }
    }

    /* ── PROJECTS ───────────────────────────────────────────── */
    .projects-grid { display: flex; flex-direction: column; gap: 1px; margin-top: 48px; }
    .project-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.3s; position: relative;
    }
    .project-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1); z-index: 1; border-radius: 4px 0 0 4px;
    }
    .project-card[data-accent="gold"]::before  { background: var(--md-gold); }
    .project-card[data-accent="red"]::before   { background: var(--md-red); }
    .project-card[data-accent="navy"]::before  { background: var(--md-navy); }
    .project-card.expanded::before { width: 3px; }
    .project-card.expanded { border-color: var(--accent); box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .project-card:hover { border-color: var(--accent); }
    .project-header:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 4px; }
    .project-header {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px;
      padding: 24px 20px 24px 24px; cursor: pointer; position: relative; transition: background 0.2s;
    }
    .project-header:hover { background: rgba(0,0,0,0.015); }
    [data-dark="true"] .project-header:hover { background: rgba(255,255,255,0.02); }
    .project-index {
      position: absolute; right: 60px; top: 50%; transform: translateY(-50%);
      font-family: var(--serif); font-size: 5rem; font-weight: 700;
      color: var(--fg); opacity: 0.035; line-height: 1; pointer-events: none;
      user-select: none; transition: opacity 0.3s;
    }
    .project-card:hover .project-index,
    .project-card.expanded .project-index { opacity: 0.06; }
    .project-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .project-meta-chip {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-light);
      padding: 2px 7px; border-radius: 2px; border: 1px solid transparent;
      transition: border-color 0.2s, letter-spacing 0.2s;
    }
    .project-header:hover .project-meta-chip { letter-spacing: 0.12em; border-color: var(--accent); }
    .project-title { font-family: var(--serif); font-size: 1.3rem; letter-spacing: -0.01em; line-height: 1.2; }
    .project-tagline {
      margin-top: 6px; font-size: 0.84rem; color: var(--fg2);
      display: inline-block; position: relative;
    }
    .project-tagline::after {
      content: ''; position: absolute; bottom: -2px; left: 0;
      height: 1px; width: 0; background: var(--accent);
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .project-header:hover .project-tagline::after { width: 100%; }
    .project-toggle {
      width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--fg2); transition: border-color 0.2s, color 0.2s, background 0.2s; flex-shrink: 0;
      min-width: 36px; z-index: 2;
    }
    .project-toggle svg { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    .project-card.expanded .project-toggle svg { transform: rotate(180deg); }
    .project-card:hover .project-toggle,
    .project-card.expanded .project-toggle { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .project-body {
      border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr;
      overflow: hidden; max-height: 0;
      transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .project-body.open { max-height: 1200px; }
    .project-details { padding: 28px 24px; border-bottom: 1px solid var(--border); position: relative; }
    .pbl-steps-wrap { position: relative; }
    .pbl-steps-wrap::before {
      content: ''; position: absolute; left: 12px; top: 14px; width: 1px; bottom: 28px;
      background: linear-gradient(to bottom, var(--accent) 0%, transparent 100%); opacity: 0.25;
    }
    .pbl-step { display: flex; gap: 14px; margin-bottom: 22px; align-items: flex-start; }
    .pbl-step:last-child { margin-bottom: 0; }
    .pbl-num {
      width: 26px; height: 26px; border-radius: 50%; background: var(--accent-light); color: var(--accent);
      border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 700; flex-shrink: 0; margin-top: 1px;
      position: relative; z-index: 1; transition: background 0.2s, transform 0.2s;
    }
    .pbl-step:hover .pbl-num { background: var(--accent); color: var(--card); transform: scale(1.1); }
    .pbl-label { font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; opacity: 0.8; }
    .pbl-text { font-size: 0.86rem; color: var(--fg); line-height: 1.65; }
    .project-demo { padding: 24px 20px; background: var(--bg2); }
    .demo-label {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--fg2); margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .demo-label::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--accent); opacity: 0.6; }

    /* ── WORKFLOW DEMO ───────────────────────────────────────── */
    @keyframes wf-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent); opacity: 1; }
      50%       { box-shadow: 0 0 0 4px transparent; opacity: 0.7; }
    }
    .wf-nodes { display: flex; flex-direction: column; gap: 8px; }
    .wf-node {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 4px; padding: 10px 14px;
      transition: border-color 0.35s, background 0.35s, transform 0.2s;
    }
    .wf-node.lit { border-color: var(--accent); background: var(--accent-light); transform: translateX(2px); }
    .wf-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.35s; flex-shrink: 0; }
    .wf-node.lit .wf-dot { background: var(--accent); animation: wf-pulse 1.2s ease-in-out infinite; }
    .wf-node-text { font-size: 0.8rem; font-weight: 500; }
    .wf-connector { width: 2px; height: 14px; background: var(--border); margin-left: 18px; transition: background 0.35s, height 0.35s; }
    .wf-connector.lit { background: var(--accent); }
    .wf-btn {
      margin-top: 14px; background: var(--cta); color: white;
      border: none; border-radius: 4px; padding: 10px 18px;
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
      font-family: var(--sans); transition: background 0.2s; min-height: 44px;
    }
    .wf-btn:hover { background: var(--cta-hover); }

    /* ── CHART DEMO ─────────────────────────────────────────── */
    .chart-wrap { position: relative; height: 180px; }

    /* ── GAME DEMO ──────────────────────────────────────────── */
    .game-q { font-size: 0.88rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
    .game-opts { display: flex; flex-direction: column; gap: 8px; }
    .game-opt {
      background: var(--card); border: 1.5px solid var(--border); border-left-width: 3px;
      border-radius: 4px; padding: 12px 14px; font-size: 0.82rem;
      cursor: pointer; transition: border-color 0.18s, border-left-color 0.1s, background 0.18s, transform 0.15s;
      text-align: left; font-family: var(--sans); color: var(--fg); min-height: 44px;
    }
    .game-opt:hover:not(:disabled) { border-color: var(--border); border-left-color: var(--accent); transform: translateX(2px); }
    .game-opt.correct { border-color: #22c55e; background: #DCFCE7; color: #166534; }
    .game-opt.wrong   { border-color: #ef4444; background: #FEE2E2; color: #991b1b; }
    .game-feedback { font-size: 0.82rem; margin-top: 10px; font-weight: 500; min-height: 20px; }
    .game-cite { font-family: var(--mono, monospace); font-size: 0.58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg2); margin-top: 6px; opacity: 0.7; padding-left: 2px; }

    /* ── TESTIMONIALS ───────────────────────────────────────── */
    .testimonials-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 48px; }
    .testimonial-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 4px; padding: 28px 24px; border-left: 3px solid var(--accent);
      transition: box-shadow 0.2s;
    }
    .testimonial-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); }
    .t-quote { font-size: 2.8rem; color: var(--accent); font-family: var(--serif); line-height: 0.8; margin-bottom: 16px; opacity: 0.7; }
    .t-text { font-size: 0.9rem; line-height: 1.75; color: var(--fg); margin-bottom: 24px; }
    .t-author { display: flex; align-items: center; gap: 12px; }
    .t-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.82rem; color: var(--accent); flex-shrink: 0;
    }
    .t-name { font-weight: 600; font-size: 0.86rem; }
    .t-role { font-size: 0.73rem; color: var(--fg2); margin-top: 2px; }
    .t-read-more {
      display: inline;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
      margin-left: 0.35em;
      transition: color 0.2s, letter-spacing 0.2s;
    }
    .t-read-more:hover {
      color: var(--cta);
      letter-spacing: 0.01em;
    }

    /* ── CREDENTIALS ────────────────────────────────────────── */
    .creds-section { background: var(--bg2); }
    .creds-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 48px; }
    .cred-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 22px 24px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      display: flex; gap: 20px; align-items: flex-start; position: relative; overflow: hidden;
    }
    .cred-card::after {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      background: var(--md-gold); transition: width 0.25s ease;
    }
    .cred-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .cred-card:hover::after { width: 3px; }
    .cred-icon { width: 56px; height: 56px; flex-shrink: 0; border-radius: 8px; background: var(--bg2); padding: 4px; border: 1px solid var(--border); display: block; line-height: 0; }
    .cred-issuer { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .cred-name { font-weight: 600; font-size: 0.9rem; line-height: 1.4; }

    /* ── CONTACT ────────────────────────────────────────────── */
    .contact-section { text-align: center; padding: 80px var(--px); }
    .contact-section .section-title { margin: 0 auto 20px; }
    .contact-sub { font-size: 0.95rem; color: var(--fg2); max-width: 480px; margin: 0 auto 40px; line-height: 1.7; }
    .contact-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer {
      border-top: 2px solid var(--md-gold); padding: 28px var(--px);
      display: flex; flex-direction: column; gap: 12px;
      align-items: center; text-align: center; font-size: 0.76rem; color: var(--fg2);
    }
    .footer-links { display: flex; gap: 20px; }
    footer a:hover { color: var(--accent); }

    /* ── SCHEME PICKER ─────────────────────────────────── */
    .scheme-picker { display: none; align-items: center; gap: 4px; background: var(--bg2); border: 1px solid var(--border); border-radius: 99px; padding: 3px 6px; }
    .scheme-dot-btn { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; transition: transform 0.18s, border-color 0.18s; position: relative; }
    .scheme-dot-btn:hover { transform: scale(1.2); }
    .scheme-dot-btn.active { border-color: var(--fg); transform: scale(1.15); }
    .scheme-dot-btn::after { content: attr(title); position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); font-size: 0.55rem; letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
    .scheme-dot-btn:hover::after, .scheme-dot-btn:focus-visible::after { opacity: 1; }
    .drawer-scheme-row { padding: 16px var(--px); border-bottom: 1px solid var(--border); }
    .drawer-scheme-label { font-size: 0.6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--fg2); margin-bottom: 10px; display: block; }
    .drawer-scheme-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .drawer-scheme-btn { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1.5px solid var(--border); border-radius: 4px; padding: 10px 12px; cursor: pointer; font-family: var(--sans); font-size: 0.78rem; font-weight: 500; color: var(--fg); flex: 1; min-width: 0; transition: border-color 0.18s, background 0.18s; -webkit-tap-highlight-color: transparent; min-height: 44px; }
    .drawer-scheme-btn:active { background: var(--accent-light); }
    .drawer-scheme-btn.active { border-color: var(--accent); background: var(--accent-light); font-weight: 700; }
    .drawer-scheme-swatch { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,0.12); }
    .drawer-monogram-wrap { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px 0 24px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
    /* Animated ring in drawer monogram */
    .drawer-mono-inner {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 156px; height: 156px;
    }
    .drawer-mono-inner svg {
      position: relative; z-index: 1;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.22));
    }
    .drawer-mono-ring {
      position: absolute; inset: -10px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      pointer-events: none;
    }
    .drawer-mono-ring::before {
      content: '';
      position: absolute; inset: -1.5px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent);
      animation: preloaderSpin 1.4s cubic-bezier(0.4,0,0.6,1) 0.1s both,
                 preloaderRingFade 0.6s ease 2.0s forwards;
    }
    /* Pop-in for drawer monogram SVG */
    .drawer-mono-inner svg {
      animation: preloaderPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0s both;
    }
    /* Dot loader in drawer */
    .drawer-mono-dots {
      display: flex; gap: 6px; margin-top: 16px;
    }
    .drawer-mono-dots span {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--border);
      animation: preloaderDot 1.1s ease 3; /* 3 cycles then stop */
    }
    .drawer-mono-dots span:nth-child(1) { animation-delay: 0s; }
    .drawer-mono-dots span:nth-child(2) { animation-delay: 0.18s; }
    .drawer-mono-dots span:nth-child(3) { animation-delay: 0.36s; }
    .tweaks-panel { position: fixed; bottom: 16px; right: 16px; width: 260px; background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; padding: 18px; z-index: 150; box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: none; }
    .tweaks-panel.visible { display: block; }
    .tweaks-title { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; color: var(--fg); }
    .tweak-row { margin-bottom: 12px; }
    .tweak-label { font-size: 0.73rem; font-weight: 600; color: var(--fg2); margin-bottom: 5px; }
    .tweak-select { width: 100%; padding: 7px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 0.78rem; }
    @media (max-width: 360px) { .tweaks-panel { right: 8px; left: 8px; width: auto; bottom: 8px; } }

    /* ── TEXT JUSTIFY PREFERENCE ────────────────────────────── */
    [data-justify="true"] .about-text p,
    [data-justify="true"] .hero-sub,
    [data-justify="true"] .t-text,
    [data-justify="true"] .pbl-text,
    [data-justify="true"] .contact-sub {
      text-align: justify;
      text-align-last: left;
      -webkit-hyphens: auto;
      -moz-hyphens:    auto;
      -ms-hyphens:     auto;
      hyphens:         auto;
    }
    /* Compact justify toggle — in nav-right, left of hamburger */
    .nav-justify-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: 1.5px solid transparent;
      border-radius: 4px; cursor: pointer; color: var(--fg2);
      transition: color 0.18s, border-color 0.18s, background 0.18s;
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .nav-justify-btn:hover {
      color: var(--accent); border-color: var(--border);
    }
    .nav-justify-btn.active {
      color: var(--accent); border-color: var(--accent);
      background: var(--accent-light);
    }

    /* ══════════════════════════════════════════════════════════
       PRELOADER — full-screen entry gate
       ══════════════════════════════════════════════════════════ */
    .jtc-preloader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg);
      cursor: pointer;
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.4,0,0.2,1);
      will-change: opacity, transform;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .jtc-preloader.exiting {
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
    }
    /* Monogram container with spinning ring */
    .jtc-preloader-mono {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 200px; height: 200px;
    }
    /* SVG monogram */
    .jtc-preloader-mono svg {
      position: relative; z-index: 1;
      animation: preloaderPop 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
      filter: drop-shadow(0 6px 24px rgba(0,0,0,0.18));
    }
    /* Spinning ring track */
    .jtc-preloader-ring {
      position: absolute; inset: -12px;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    /* Spinning ring arc */
    .jtc-preloader-ring::before {
      content: '';
      position: absolute; inset: -2px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent);
      animation: preloaderSpin 1.4s cubic-bezier(0.4,0,0.6,1) 0.3s both,
                 preloaderRingFade 0.6s ease 2.2s forwards;
    }
    /* Dot loader row */
    .jtc-preloader-dots {
      display: flex; gap: 7px; margin-top: 28px;
      animation: fadeIn 0.4s ease 0.8s both;
    }

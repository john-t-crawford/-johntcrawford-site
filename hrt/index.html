<style>
/* ============================================================
   CYANOTYPE SPECIMEN SYSTEM
   Ground: Prussian blue exposure. Specimens print white.
   Annotation accents drawn from the Maryland flag.
   ============================================================ */
:root{
  --ground-deep:#0A1626;
  --ground:#0F2A47;
  --ground-lift:#16406B;
  --plate:#123456;
  --print:#E8F1FA;
  --print-dim:#9FC0DC;
  --print-faint:#5C87AD;
  --gold:#EAAA00;
  --gold-deep:#8A6500;
  --red:#CE1126;
  --red-lift:#FF5C6E;
  --rule:rgba(159,192,220,.28);
  --rule-firm:rgba(159,192,220,.55);

  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

  --step--1:clamp(.75rem,.72rem + .15vw,.82rem);
  --step-0:clamp(.95rem,.9rem + .25vw,1.05rem);
  --step-1:clamp(1.15rem,1.05rem + .5vw,1.4rem);
  --step-2:clamp(1.5rem,1.3rem + 1vw,2.1rem);
  --step-3:clamp(2rem,1.6rem + 2vw,3.2rem);

  --gap:clamp(.75rem,.5rem + 1.5vw,1.25rem);
  --pad:clamp(1rem,.6rem + 2vw,2rem);
  --tap:44px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground-deep);
  color:var(--print);
  font:400 var(--step-0)/1.55 var(--sans);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
/* Ambient exposure wash — static, no animation */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 80% at 50% -10%,rgba(22,64,107,.85),transparent 60%),
    radial-gradient(90% 60% at 100% 100%,rgba(18,52,86,.6),transparent 65%);
}
#root{position:relative;z-index:1}

/* ---------- Skip link ---------- */
.skip{
  position:absolute;left:-9999px;top:0;z-index:100;
  background:var(--gold);color:#1A1200;font:600 var(--step-0)/1 var(--sans);
  padding:14px 20px;border-radius:0 0 6px 0;text-decoration:none;
}
.skip:focus{left:0}

/* ---------- Focus ---------- */
:where(a,button,input,select,summary,[tabindex]):focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px;
  border-radius:3px;
}

/* ---------- Shell ---------- */
.shell{max-width:960px;margin:0 auto;padding:var(--pad) var(--gap) 4rem}

/* ---------- Masthead ---------- */
.masthead{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:var(--gap);
  padding-bottom:.9rem;margin-bottom:var(--gap);
  border-bottom:1px solid var(--rule-firm);
}
.masthead h1{
  margin:0;font:400 var(--step-2)/1.05 var(--serif);
  letter-spacing:-.015em;
}
.masthead h1 em{font-style:italic;color:var(--gold)}
.masthead .sub{
  margin:.35rem 0 0;font:400 var(--step--1)/1.4 var(--mono);
  color:var(--print-dim);letter-spacing:.06em;text-transform:uppercase;
}

/* ---------- Score strip ---------- */
.strip{display:flex;gap:1.25rem;font:500 var(--step--1)/1 var(--mono);color:var(--print-dim)}
.strip b{display:block;font:600 var(--step-1)/1.2 var(--mono);color:var(--print);margin-top:.25rem}
.strip .hot b{color:var(--gold)}

/* ---------- Accession header ---------- */
.accession{
  display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;
  font:500 var(--step--1)/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--print-faint);margin-bottom:.6rem;
}
.tier{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.3rem .6rem;border:1px solid var(--rule-firm);border-radius:999px;
  color:var(--print-dim);
}
.tier[data-t="1"]{border-color:rgba(234,170,0,.5);color:var(--gold)}
.tier[data-t="3"]{border-color:rgba(206,17,38,.55);color:var(--red-lift)}

/* ============================================================
   SIGNATURE: the cyanotype specimen plate
   ============================================================ */
.plate{
  position:relative;
  background:
    linear-gradient(155deg,#164572 0%,#10365C 45%,#0D2B4A 100%);
  border:1px solid var(--rule-firm);
  border-radius:4px;
  padding:clamp(.75rem,2vw,1.5rem);
  box-shadow:0 1px 0 rgba(232,241,250,.12) inset,0 18px 40px -24px #000;
  overflow:hidden;
}
/* paper-grain of the exposure */
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(232,241,250,.035) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(10,22,38,.05) 0 1px,transparent 1px 4px);
  mix-blend-mode:overlay;
}
.plate-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:clamp(.5rem,1.5vw,1rem);
  align-items:stretch;
}
.panel{
  position:relative;
  background:rgba(10,22,38,.3);
  border:1px solid rgba(159,192,220,.22);
  border-radius:3px;
  min-height:170px;
  display:flex;flex-direction:column;
}
.panel svg{display:block;width:100%;height:auto;flex:1}
.panel.photo img{
  display:block;width:100%;flex:1;min-height:0;object-fit:cover;
  border-radius:2px;
  /* the plate is a cyanotype; photographs are exposed to match */
  filter:grayscale(1) contrast(1.08) sepia(.35) hue-rotate(165deg) saturate(2.2) brightness(.92);
}
.panel.photo .credit{
  font:400 9px/1.35 var(--mono);color:var(--print-faint);
  padding:.35rem .5rem .45rem;
}
@media (prefers-contrast:more){.panel.photo img{filter:none}}
.panel-tag{
  font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--print-faint);padding:.5rem .55rem 0;
}
/* locked (unrevealed) panel */
.panel.locked{
  align-items:center;justify-content:center;
  border-style:dashed;background:rgba(10,22,38,.5);
}
.panel.locked span{
  font:500 var(--step--1)/1.3 var(--mono);color:var(--print-faint);
  text-align:center;padding:1rem;
}
/* exposure reveal */
@media (prefers-reduced-motion:no-preference){
  .panel.fresh{animation:expose .55s ease-out both}
  @keyframes expose{
    from{opacity:0;filter:blur(6px)}
    to{opacity:1;filter:blur(0)}
  }
}

/* ---------- Evidence controls ---------- */
.evidence{
  display:flex;flex-wrap:wrap;gap:.5rem;margin:var(--gap) 0;
}
.ev-btn{
  min-height:var(--tap);min-width:var(--tap);
  padding:.6rem 1rem;
  font:600 var(--step--1)/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--print);background:transparent;
  border:1px solid var(--rule-firm);border-radius:3px;
  cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;
}
.ev-btn:hover:not(:disabled){background:var(--ground-lift);border-color:var(--print-dim)}
.ev-btn[aria-pressed="true"]{
  background:rgba(234,170,0,.14);border-color:var(--gold);color:var(--gold);
}
.ev-btn:disabled{opacity:.45;cursor:not-allowed}
.ev-btn .cost{font-weight:400;color:var(--print-faint)}
.ev-btn[aria-pressed="true"] .cost{color:var(--gold-deep)}

/* ---------- Determination ---------- */
.determination{margin-top:var(--gap)}
.det-label{
  font:600 var(--step--1)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--print-faint);display:block;margin-bottom:.6rem;
}
.options{display:grid;grid-template-columns:1fr;gap:.6rem}
@media(min-width:620px){.options{grid-template-columns:1fr 1fr}}

.opt{
  display:flex;flex-direction:column;gap:.15rem;
  min-height:var(--tap);
  padding:.85rem 1rem;text-align:left;
  background:rgba(18,52,86,.55);
  border:1px solid var(--rule-firm);border-radius:4px;
  color:var(--print);cursor:pointer;
  font:400 var(--step-0)/1.3 var(--sans);
}
.opt:hover:not(:disabled){background:var(--ground-lift);border-color:var(--print-dim)}
.opt:disabled{cursor:default}
.opt .latin{font:italic 400 var(--step--1)/1.3 var(--serif);color:var(--print-dim)}
.opt .common{font:400 var(--step-0)/1.25 var(--sans)}
.opt.correct{border-color:var(--gold);background:rgba(234,170,0,.16)}
.opt.correct .latin,.opt.correct .common{color:var(--gold)}
.opt.wrong{border-color:var(--red-lift);background:rgba(206,17,38,.18)}
.opt.wrong .latin,.opt.wrong .common{color:var(--red-lift)}
.opt .mark{
  font:600 var(--step--1)/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-top:.3rem;
}

/* ---------- Free recall (tier 3) ---------- */
.recall{display:flex;flex-wrap:wrap;gap:.6rem;align-items:stretch}
.recall input{
  flex:1 1 240px;min-height:var(--tap);
  padding:.7rem .9rem;
  background:rgba(10,22,38,.55);
  border:1px solid var(--rule-firm);border-radius:4px;
  color:var(--print);font:italic 400 var(--step-0)/1.3 var(--serif);
}
.recall input::placeholder{color:var(--print-faint);font-style:normal;font-family:var(--sans)}
.recall .hintline{flex:1 1 100%;font:400 var(--step--1)/1.4 var(--mono);color:var(--print-faint)}

/* ---------- Buttons ---------- */
.btn{
  min-height:var(--tap);padding:.7rem 1.4rem;
  font:600 var(--step-0)/1.2 var(--sans);
  border-radius:4px;cursor:pointer;border:1px solid transparent;
}
.btn-primary{background:var(--gold);color:#1A1200;border-color:var(--gold)}
.btn-primary:hover{background:#FFC01F}
.btn-ghost{background:transparent;color:var(--print);border-color:var(--rule-firm)}
.btn-ghost:hover{background:var(--ground-lift)}

/* ---------- Verdict / determination label ---------- */
.verdict{
  margin-top:var(--gap);
  border:1px solid var(--rule-firm);border-left:4px solid var(--gold);
  border-radius:3px;background:rgba(10,22,38,.55);
  padding:1rem 1.1rem;
}
.verdict.miss{border-left-color:var(--red-lift)}
.verdict h2{
  margin:0 0 .1rem;font:italic 400 var(--step-1)/1.2 var(--serif);
}
.verdict .cn{margin:0 0 .75rem;font:400 var(--step--1)/1.3 var(--sans);color:var(--print-dim)}
.verdict dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font-size:var(--step--1)}
.verdict dt{font:600 var(--step--1)/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--print-faint)}
.verdict dd{margin:0;color:var(--print)}
.verdict .actions{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.6rem}

.compare{
  margin-top:var(--gap);padding-top:var(--gap);
  border-top:1px solid var(--rule-firm);
}
.cmp-grid{display:grid;grid-template-columns:1fr;gap:var(--gap)}
@media(min-width:560px){.cmp-grid{grid-template-columns:1fr 1fr}}
.cmp-col h3{margin:0 0 .6rem;font:400 var(--step-0)/1.25 var(--sans)}
.cmp-col h3 em{display:block;font-style:italic;font:italic 400 var(--step--1)/1.4 var(--serif);color:var(--print-dim)}
.cmp-col h3 span{font:400 var(--step-0)/1.25 var(--sans);color:var(--gold)}
.cmp-plates{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.cmp-cell{
  background:rgba(10,22,38,.4);border:1px solid rgba(159,192,220,.22);border-radius:3px;
}
.cmp-cell svg{display:block;width:100%;height:auto}

.diff{width:100%;border-collapse:collapse;margin:var(--gap) 0;font-size:var(--step--1)}
.diff caption{
  text-align:left;font:600 var(--step--1)/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--print-faint);padding-bottom:.6rem;
}
.diff th,.diff td{text-align:left;padding:.5rem .5rem;border-bottom:1px solid var(--rule);vertical-align:top}
.diff thead th{font:600 var(--step--1)/1.3 var(--mono);letter-spacing:.06em;color:var(--gold)}
.diff tbody th{font:600 var(--step--1)/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--print-faint);white-space:nowrap}
.diff td{color:var(--print)}

/* ---------- Setup / summary ---------- */
.card{
  border:1px solid var(--rule-firm);border-radius:4px;
  background:rgba(18,52,86,.4);padding:var(--pad);margin-bottom:var(--gap);
}
.card h2{margin:0 0 .5rem;font:400 var(--step-1)/1.2 var(--serif)}
.card p{margin:0 0 1rem;color:var(--print-dim)}
fieldset{border:0;margin:0 0 1.25rem;padding:0}
legend{
  font:600 var(--step--1)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--print-faint);padding:0;margin-bottom:.6rem;
}
.choices{display:flex;flex-wrap:wrap;gap:.5rem}
.choice{position:relative}
.choice input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice span{
  display:flex;align-items:center;min-height:var(--tap);padding:.6rem 1.1rem;
  border:1px solid var(--rule-firm);border-radius:999px;
  font:500 var(--step-0)/1.2 var(--sans);
}
.choice input:checked + span{background:rgba(234,170,0,.16);border-color:var(--gold);color:var(--gold)}
.choice input:focus-visible + span{outline:3px solid var(--gold);outline-offset:3px}

.setup-note{margin:.6rem 0 0;font:400 var(--step--1)/1.5 var(--mono);color:var(--print-faint);max-width:62ch}

/* ---------- Summary table ---------- */
.tally{width:100%;border-collapse:collapse;font-size:var(--step--1);margin-top:.5rem}
.tally th,.tally td{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--rule)}
.tally th{font:600 var(--step--1)/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--print-faint)}
.tally .latin{font:italic 400 var(--step--1)/1.2 var(--serif);color:var(--print-dim)}
.tally .common{font:400 var(--step-0)/1.2 var(--sans)}
.tally .res{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.tally .res.ok{color:var(--gold)}
.tally .res.no{color:var(--red-lift)}

/* ---------- Utility ---------- */
.visually-hidden{
  position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
.footnote{
  margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--rule);
  font:400 var(--step--1)/1.6 var(--mono);color:var(--print-faint);
}

@media (prefers-contrast:more){
  :root{--rule-firm:rgba(232,241,250,.9);--print-dim:#D3E4F3;--print-faint:#B4CFE6}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ============================================================
   LEARN BRANCH
   ============================================================ */
.gate-grid{display:grid;grid-template-columns:1fr;gap:var(--gap);margin-bottom:var(--gap)}
@media(min-width:620px){.gate-grid{grid-template-columns:1fr 1fr}}
.gate-door{
  display:flex;flex-direction:column;gap:.4rem;text-align:left;
  min-height:var(--tap);padding:1.25rem 1.35rem;cursor:pointer;
  background:rgba(18,52,86,.55);border:1px solid var(--rule-firm);border-radius:5px;
  color:var(--print);font:inherit;
}
.gate-door:hover{background:var(--ground-lift);border-color:var(--gold)}
.gate-eyebrow{font:600 var(--step--1)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--print-faint)}
.gate-title{font:400 var(--step-1)/1.2 var(--serif);color:var(--gold)}
.gate-blurb{font:400 var(--step--1)/1.5 var(--sans);color:var(--print-dim)}
.gate-photos{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  min-height:var(--tap);padding:.9rem 1.1rem;
  background:rgba(234,170,0,.08);border:1px solid rgba(234,170,0,.35);border-radius:5px;
  text-decoration:none;color:inherit;
}
.gate-photos:hover{background:rgba(234,170,0,.14);border-color:var(--gold)}
.gate-photos .gp-txt b{display:block;font:400 var(--step-0)/1.3 var(--serif);color:var(--gold)}
.gate-photos .gp-txt span{font:400 var(--step--1)/1.4 var(--sans);color:var(--print-dim)}
.gate-photos .gp-arrow{flex:none;font:600 var(--step--1)/1 var(--mono);color:var(--gold)}

.tracks{display:grid;grid-template-columns:1fr;gap:.7rem;margin-bottom:1.25rem}
.track{
  display:flex;flex-direction:column;gap:.25rem;text-align:left;
  min-height:var(--tap);padding:1rem 1.15rem;cursor:pointer;
  background:rgba(18,52,86,.5);border:1px solid var(--rule-firm);border-radius:4px;
  color:var(--print);font:inherit;
}
.track:hover{background:var(--ground-lift);border-color:var(--gold)}
.track-name{font:400 var(--step-1)/1.2 var(--serif);color:var(--gold)}
.track-meta{font:500 var(--step--1)/1 var(--mono);letter-spacing:.08em;color:var(--print-faint)}
.track-blurb{font:400 var(--step--1)/1.5 var(--sans);color:var(--print-dim)}

.progress{
  height:3px;background:rgba(159,192,220,.2);border-radius:2px;overflow:hidden;margin-bottom:var(--gap);
}
.progress span{display:block;height:100%;background:var(--gold)}
@media (prefers-reduced-motion:no-preference){.progress span{transition:width .35s ease}}

.slide{
  background:rgba(18,52,86,.4);border:1px solid var(--rule-firm);border-radius:4px;
  padding:var(--pad);
}
.slide h2{margin:0 0 .9rem;font:400 var(--step-2)/1.2 var(--serif);color:var(--print);letter-spacing:-.01em}
.slide h2:focus{outline:none}
.slide h2:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.slide p{margin:0 0 1rem;color:var(--print-dim);max-width:64ch}
.slide p:last-of-type{margin-bottom:0}

.exhibits{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:.75rem;margin-top:1.4rem;
}
.exhibit{margin:0}
.exhibit-plate{
  background:linear-gradient(155deg,#164572,#0D2B4A);
  border:1px solid rgba(159,192,220,.25);border-radius:3px;
}
.exhibit-plate svg{display:block;width:100%;height:auto}
.exhibit-photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px}
.exhibit figcaption{padding:.5rem .1rem 0;font-size:var(--step--1);line-height:1.4}
.exhibit figcaption b{display:block;font-weight:600;color:var(--print)}
.exhibit figcaption em{font-style:italic;color:var(--print-faint);font-family:var(--serif)}
.exhibit-credit{display:block;font-size:.82em;color:var(--print-faint);margin-top:.15rem}

.lesson-nav{display:flex;gap:.6rem;flex-wrap:wrap;margin:var(--gap) 0}
.audiobar{
  display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;
  padding-top:var(--gap);border-top:1px solid var(--rule);
}
.vol{display:flex;align-items:center;gap:.6rem;min-height:var(--tap)}
.vol span{font:600 var(--step--1)/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--print-faint)}
.vol input{accent-color:var(--gold);min-width:110px;height:var(--tap)}
.audionote{flex:1 1 100%;margin:.4rem 0 0;font:400 var(--step--1)/1.5 var(--mono);color:var(--print-faint)}

.linkish{
  background:none;border:0;padding:.6rem .2rem;min-height:var(--tap);cursor:pointer;
  font:600 var(--step--1)/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--print-dim);text-decoration:underline;text-underline-offset:3px;
}
.linkish:hover{color:var(--gold)}
.linkish.top{margin-left:auto;align-self:flex-end}

/* ============================================================
   MOBILE-FIRST CORRECTIONS AND INSTRUCTION SYSTEM
   ============================================================ */
body{
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
.shell{
  padding-left:max(var(--gap),env(safe-area-inset-left));
  padding-right:max(var(--gap),env(safe-area-inset-right));
}
/* nothing below 12px: 9 and 10px labels were unreadable on a phone */
.panel-tag{font-size:12px}
.panel.photo .credit{font-size:12px;line-height:1.45}
.tally .res{font-size:12px}
.exhibit figcaption{font-size:13px}

/* ---------- numbered instructions ---------- */
.howto{
  counter-reset:step;
  margin:0 0 1.1rem;padding:0;list-style:none;
}
.howto li{
  counter-increment:step;
  position:relative;
  padding:0 0 .7rem 2.4rem;
  color:var(--print-dim);
  font-size:var(--step-0);line-height:1.5;
}
.howto li::before{
  content:counter(step);
  position:absolute;left:0;top:0;
  width:1.7rem;height:1.7rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(234,170,0,.16);border:1px solid rgba(234,170,0,.5);
  color:var(--gold);font:600 .8rem/1 var(--mono);
}
.howto li b{color:var(--print);font-weight:600}
.howto li:last-child{padding-bottom:0}

/* ---------- the "do this now" line ---------- */
.nowdo{
  display:flex;align-items:flex-start;gap:.6rem;
  margin:0 0 .8rem;padding:.7rem .85rem;
  background:rgba(234,170,0,.1);border-left:3px solid var(--gold);border-radius:0 4px 4px 0;
  font:400 var(--step-0)/1.45 var(--sans);color:var(--print);
}
.nowdo .lbl{
  flex:none;font:600 var(--step--1)/1.5 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);
}
.nowdo.quiet{background:rgba(159,192,220,.08);border-left-color:var(--print-faint)}
.nowdo.quiet .lbl{color:var(--print-faint)}

/* ---------- evidence block gets a heading and a live score ---------- */
.evhead{
  display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem;
  margin:var(--gap) 0 .5rem;
}
.evhead h3{
  margin:0;font:600 var(--step--1)/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--print-faint);
}
.evhead .worth{font:600 var(--step--1)/1 var(--mono);color:var(--gold)}
.evidence{margin-top:0}

/* ---------- sticky primary action on phones ---------- */
@media (max-width:640px){
  .stickybar{
    position:sticky;bottom:0;z-index:20;
    margin:1rem calc(var(--gap) * -1) 0;
    padding:.75rem var(--gap) calc(.75rem + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--ground-deep) 68%,rgba(10,22,38,0));
    display:flex;gap:.6rem;
  }
  .stickybar .btn{flex:1}
  .plate-grid{grid-template-columns:1fr 1fr}
  .masthead{align-items:flex-start}
  .strip{gap:1rem}
}
@media (max-width:400px){
  .plate-grid{grid-template-columns:1fr}
  .panel{min-height:150px}
}
</style>

          h('span', { className: 'gate-title' }, 'Teach me first'),
          h('span', { className: 'gate-blurb' }, 'A friendly, narrated walkthrough of what to actually look for: leaf shape, bark, overall shape. Because guessing is for suckers, the plant kind, not you. Three depths, using the same plates the game shows you.')),
        h('button', { className: 'gate-door', onClick: function () { props.onPick('practice'); } },
          h('span', { className: 'gate-eyebrow' }, 'Play'),
          h('span', { className: 'gate-title' }, 'Just let me play'),
          h('span', { className: 'gate-blurb' }, 'See a plant, take your best guess, get instant feedback. No pressure, we have all mistaken a viburnum for a lilac. Peek at extra clues if you want them; fewer peeks means a higher score. Pick your difficulty and how you answer.'))),
      Object.keys(PHOTOS).length
        ? h('a', { className: 'gate-photos', href: './sheets.html' },
            h('span', { className: 'gp-txt' },
              h('b', null, 'Or just leaf through the photos'),
              h('span', null, Object.keys(PHOTOS).length + ' of ' + PLANTS.length + ' specimens have real photographs I took myself, paired with the drawn plate for each. Proof I really do stop and photograph shrubs on purpose.')),
            h('span', { className: 'gp-arrow' }, 'Specimen sheets \u2192'))
        : null);
  }

  function App() {
    var mS = useState(null), mode = mS[0], setMode = mS[1];
    var a = useState(null), run = a[0], setRun = a[1];
    var b = useState(0), idx = b[0], setIdx = b[1];
    var c = useState({ leaf: true }), open = c[0], setOpen = c[1];
    var d = useState(null), verdict = d[0], setVerdict = d[1];
    var e = useState(''), typed = e[0], setTyped = e[1];
    var f = useState(0), score = f[0], setScore = f[1];
    var cmpS = useState(null), cmp = cmpS[0], setCmp = cmpS[1];
    var loS = useState(false), latinOnly = loS[0], setLatinOnly = loS[1];
    var g = useState(0), streak = g[0], setStreak = g[1];
    var i2 = useState([]), log = i2[0], setLog = i2[1];
    var vRef = useRef(null), inRef = useRef(null);

    /* restore an interrupted run */
    useEffect(function () {
      try {
        var raw = sessionStorage.getItem(SS);
        if (!raw) return;
        var s = JSON.parse(raw);
        if (!s || !s.ids || !s.ids.length) return;
        setRun(s.ids.map(function (q) {
          return { plant: BY_ID[q.p], options: q.o ? q.o.map(function (id) { return BY_ID[id]; }) : null };
        }));
        setIdx(s.i || 0); setScore(s.sc || 0); setStreak(s.st || 0);
        setLog((s.lg || []).map(function (l) { return { plant: BY_ID[l.p], given: l.g, ok: l.ok }; }));
      } catch (err) { /* a stale session is not worth surfacing */ }
    }, []);

    useEffect(function () {
      if (!run) { try { sessionStorage.removeItem(SS); } catch (err) {} return; }
      try {
        sessionStorage.setItem(SS, JSON.stringify({
          ids: run.map(function (q) { return { p: q.plant.id, o: q.options ? q.options.map(function (x) { return x.id; }) : null }; }),
          i: idx, sc: score, st: streak,
          lg: log.map(function (l) { return { p: l.plant.id, g: l.given, ok: l.ok }; })
        }));
      } catch (err) {}
    }, [run, idx, score, streak, log]);

    useEffect(function () { if (verdict && vRef.current) vRef.current.focus(); }, [verdict]);

    var q = run && idx < run.length ? run[idx] : null;

    var start = useCallback(function (cfg) {
      setRun(buildRun(cfg)); setLatinOnly(!!cfg.latinOnly); setIdx(0); setOpen({ leaf: true });
      setVerdict(null); setTyped(''); setScore(0); setStreak(0); setLog([]);
    }, []);

    function expose(key) {
      if (verdict) return;
      setOpen(function (o) { var n = {}; for (var k in o) n[k] = o[k]; n[key] = !o[key]; return n; });
    }

    function penalty() {
      return PANELS.reduce(function (t, m) { return t + (open[m.key] ? m.cost : 0); }, 0);
    }

    function settle(ok, given, near, called) {
      var pts = ok ? Math.max(25, 100 - penalty()) : 0;
      setScore(function (s) { return s + pts; });
      setStreak(function (s) { return ok ? s + 1 : 0; });
      setLog(function (l) { return l.concat([{ plant: q.plant, given: given, ok: ok }]); });
      setVerdict({ ok: ok, pts: pts, near: near || null, given: given, calledPlant: called || null });
    }

    function choose(p) { if (!verdict) settle(p.id === q.plant.id, p.latin, null, p); }

    function submitTyped() {
      if (verdict) return;
      var r = grade(typed, q.plant, !!latinOnly);
      if (r.verdict === 'blank') { if (inRef.current) inRef.current.focus(); return; }
      settle(r.verdict === 'exact' || r.verdict === 'spelling', typed.trim(), r.hint || null);
    }

    function next() {
      setVerdict(null); setTyped(''); setCmp(null); setOpen({ leaf: true }); setIdx(function (i) { return i + 1; });
    }

    function drillMissed() {
      var missed = log.filter(function (l) { return !l.ok; }).map(function (l) { return l.plant; });
      var optCount = run[0].options ? run[0].options.length : 0;
      setRun(missed.map(function (p) { return { plant: p, options: optCount ? shuffle(distractors(p, optCount - 1).concat([p])) : null }; }));
      setIdx(0); setOpen({ leaf: true }); setVerdict(null); setTyped(''); setScore(0); setStreak(0); setLog([]);
    }

    var header = h('header', { className: 'masthead' },
      h('div', null,
        h('h1', null, 'Name That ', h('em', null, 'Plant')),
        h('p', { className: 'sub' }, 'Trees & shrubs of Maryland \u00b7 ' + PLANTS.length + ' plants, zero small talk required')),
      mode && !run ? h('button', { className: 'linkish top', onClick: function () { setMode(null); setRun(null); } }, 'Switch mode') : null,
      run ? h('div', { className: 'strip' },
        h('div', null, 'Score', h('b', null, score)),
        h('div', { className: streak > 2 ? 'hot' : '' }, 'Streak', h('b', null, streak))) : null
    );

    var body;
    if (!mode) {
      body = h(ModeGate, { onPick: setMode });
    } else if (mode === 'learn') {
      body = h(W.Learn, {
        onBack: function () { setMode(null); },
        onFinish: function () { setMode('practice'); }
      });
    } else if (!run) {
      body = h(Setup, { onStart: start });
    } else if (!q) {
      body = h(Summary, { log: log, score: score, onAgain: function () { setRun(null); }, onDrill: drillMissed });
    } else {
      var plant = q.plant;
      body = h('div', null,
        h('div', { className: 'accession' },
          h('span', null, 'Plant ' + String(idx + 1).padStart(3, '0') + ' / ' + String(run.length).padStart(3, '0')),
          h('span', { className: 'tier', 'data-t': String(plant.tier) },
            plant.tier === 1 ? 'Easy ID' : plant.tier === 2 ? 'Takes a look' : 'Tricky twins')),

        h('div', { className: 'nowdo' + (verdict ? ' quiet' : '') },
          h('span', { className: 'lbl' }, verdict ? 'Next' : 'Your turn'),
          h('span', null, verdict
            ? 'Check the clues below, then move on to the next plant.'
            : (q.options
                ? 'Take a look, then pick the name below. Stuck? Ask for another clue.'
                : 'Take a look, then type the name below and press Guess. Stuck? Ask for another clue.'))),

        h('div', { className: 'plate' },
          h('div', { className: 'plate-grid' },
            panelsFor(plant).map(function (m) {
              return h(Panel, { key: m.key + plant.id, meta: m, plant: plant, open: !!open[m.key] });
            }))),

        h('div', { className: 'evhead' },
          h('h3', null, 'Stuck? Ask for another clue'),
          h('span', { className: 'worth', 'aria-live': 'polite' },
            verdict ? '\u2014' : 'Guess now and score ' + Math.max(25, 100 - penalty()) + ' points')),

        h('div', { className: 'evidence', role: 'group', 'aria-label': 'Ask for another clue' },
          panelsFor(plant).filter(function (m) { return m.cost > 0; }).map(function (m) {
            return h('button', {
              key: m.key, type: 'button', className: 'ev-btn', disabled: !!verdict,
              'aria-pressed': open[m.key] ? 'true' : 'false',
              onClick: function () { expose(m.key); }
            }, m.label, h('span', { className: 'cost' }, '\u2212' + m.cost));
          })),

        h('div', { className: 'determination' },
          h('span', { className: 'det-label', id: 'detlab' }, 'Your guess'),
          q.options
            ? h('div', { className: 'options', role: 'group', 'aria-labelledby': 'detlab' },
                q.options.map(function (o) {
                  var cls = 'opt';
                  if (verdict) {
                    if (o.id === plant.id) cls += ' correct';
                    else if (!verdict.ok && norm(o.latin) === norm(verdict.given || '')) cls += ' wrong';
                  }
                  return h('button', { key: o.id, type: 'button', className: cls, disabled: !!verdict, onClick: function () { choose(o); } },
                    h('span', { className: 'common' }, o.common),
                    h('span', { className: 'latin' }, o.latin),
                    verdict && o.id === plant.id ? h('span', { className: 'mark' }, 'that\u2019s the one') : null);
                }))
            : h('div', { className: 'recall' },
                h('label', { className: 'visually-hidden', htmlFor: 'recall' }, 'Type the Latin binomial or common name'),
                h('input', {
                  id: 'recall', ref: inRef, value: typed, disabled: !!verdict, autoComplete: 'off', spellCheck: false,
                  placeholder: latinOnly ? 'Genus species' : 'Genus species \u2014 or a common name',
                  onChange: function (ev) { setTyped(ev.target.value); },
                  onKeyDown: function (ev) { if (ev.key === 'Enter') submitTyped(); }
                }),
                h('button', { className: 'btn btn-primary', disabled: !!verdict, onClick: submitTyped }, 'Guess'),
                h('span', { className: 'hintline' }, latinOnly
                  ? 'Scientific name only. Small misspellings are fine; the genus alone is not enough.'
                  : 'Scientific name or any common name the plant is honestly known by. Small misspellings are fine; the genus alone is not enough.'))),

        h('div', { 'aria-live': 'polite' },
          verdict ? h('div', { className: 'verdict' + (verdict.ok ? '' : ' miss') },
            h('h2', { tabIndex: -1, ref: vRef },
              (verdict.ok ? 'Got it \u2014 ' : 'Not quite \u2014 ') , plant.common),
            h('p', { className: 'cn' }, h('em', null, plant.latin), ' \u00b7 ' + plant.fam +
              (verdict.ok ? ' \u00b7 ' + verdict.pts + ' points' : '')),
            verdict.near ? h('p', { className: 'cn' }, verdict.near) : null,
            h('dl', null,
              h('dt', null, 'Leaves'), h('dd', null, describe('leaf', plant)),
              h('dt', null, 'Bark'), h('dd', null, describe('bark', plant)),
              h('dt', null, 'Shape'), h('dd', null, describe('habit', plant)),
              h('dt', null, 'Fruit'), h('dd', null, describe('repro', plant)),
              invasiveNote(plant) ? h('dt', null, 'Status') : null,
              invasiveNote(plant) ? h('dd', null, invasiveNote(plant)) : null,
              (plant.syn && plant.syn.length) ? h('dt', null, 'Also called') : null,
              (plant.syn && plant.syn.length) ? h('dd', null, plant.syn.join(', ')) : null),
            photosFor(plant).length ? h('p', { className: 'cn' },
              'Photography: ' + photosFor(plant).map(function (x) {
                return (x.credit || 'uncredited') + (x.license ? ' (' + x.license + ')' : '');
              }).join('; ')) : null,
            h('div', { className: 'actions stickybar' },
              (!verdict.ok && verdict.calledPlant) ? h('button', {
                className: 'btn btn-ghost',
                onClick: function () { setCmp(cmp ? null : { a: verdict.calledPlant, b: plant }); }
              }, cmp ? 'Hide comparison' : 'These two get mixed up — compare them') : null,
              h('button', { className: 'btn btn-primary', onClick: next },
                idx + 1 < run.length ? 'Next plant' : 'See how I did'),
              h('button', { className: 'btn btn-ghost', onClick: function () { setRun(null); } }, 'Stop here')),
            cmp ? h(Compare, { a: cmp.a, b: cmp.b, onClose: function () { setCmp(null); } }) : null) : null)
      );
    }

    return h('div', { className: 'shell' }, header,
      h('main', { id: 'main' }, body),
      h('p', { className: 'footnote' },
        'Every plate here is drawn from the plant\u2019s real characters, not traced from a photo. ' +
        'Real photos, where available, come from the photos.js sidecar and carry their own credit and licence. ' +
        'Every image also has a plain-text description for screen readers. Your progress is kept in this browser tab ' +
        'and clears when you close it \u2014 nothing is uploaded anywhere. This list started as a 1988 Maryland ' +
        'horticulture course; eleven of the 121 plants are flagged as invasive or discouraged in Maryland today, ' +
        'even though they were standard nursery stock back then.'),
      h('p', { className: 'footnote' },
        h('a', { href: './case-study.html', style: { color: 'var(--gold)' } }, 'How this was built \u2192'),
        ' \u00b7 ',
        h('a', { href: './worksheet.html', style: { color: 'var(--gold)' } }, 'Sourcing worksheet'),
        ' \u00b7 ',
        h('a', { href: './field.html', style: { color: 'var(--gold)' } }, 'Field capture'),
        ' \u00b7 ',
        h('a', { href: './sheets.html', style: { color: 'var(--gold)' } }, 'Specimen sheets'),
        ' \u00b7 ',
        h('a', { href: 'https://johntcrawford.com/#projects', style: { color: 'var(--gold)' } }, 'johntcrawford.com'))
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})(window.WOODY);
</script>
</body>
</html>

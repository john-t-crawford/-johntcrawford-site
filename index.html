  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --md-gold:#F0A500;--md-gold-light:#FEF3D0;--md-gold-dim:#B87D00;--md-red:#CE1126;--md-red-light:#FCEAEC;--md-black:#111111;--md-navy:#0F1B2D;--md-white:#F7F4EE;
      --bg:#F7F4EE;--bg2:#EDE9E0;--fg:#111111;--fg2:#4A4035;--accent:#B87D00;--accent-light:#FEF3D0;--cta:#CE1126;--cta-hover:#A50D1E;--border:#D5CEBC;--card:#FFFFFF;

    [data-dark="true"] {--bg:#0F1B2D;--bg2:#162236;--fg:#F7F4EE;--fg2:#C8B99A;--accent:#F0A500;--accent-light:#2A1F00;--cta:#CE1126;--cta-hover:#E8253D;--border:#243450;--card:#162236;}

    .btn-primary:focus-visible,.btn-secondary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px;}
    :focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px;}
    :focus:not(:focus-visible){outline:none;}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;}html{scroll-behavior:auto;}}

    @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

    ::selection{background:var(--accent);color:white;}
    a{color:inherit;text-decoration:none;}
    img{display:block;max-width:100%;}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

    nav.scrolled{border-color:var(--md-gold);box-shadow:0 1px 20px rgba(0,0,0,0.06);border-bottom-width:2px;}
    .nav-logo{font-family:var(--serif);font-size:1.05rem;letter-spacing:-0.01em;transition:color 0.2s;}
    .nav-logo:hover{color:var(--accent);}
    .nav-right{display:flex;align-items:center;gap:8px;}
    .hamburger{display:flex;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;padding:10px;background:none;border:none;cursor:pointer;border-radius:4px;}
    .hamburger span{display:block;height:2px;background:var(--fg);border-radius:2px;transform-origin:center;transition:transform 0.25s,opacity 0.25s,width 0.25s;}

    .hamburger.open span:nth-child(2){opacity:0;width:0;}
    .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
    .nav-drawer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;height:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;visibility:hidden;opacity:0;pointer-events:none;transition:opacity 0.22s ease,visibility 0s linear 0.22s,background 0.6s ease;}

    .nav-drawer a:active{color:var(--md-gold);background:rgba(240,165,0,0.07);}
    .nav-drawer-footer{padding:20px var(--px);padding-bottom:max(20px,env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0;position:relative;z-index:1;}

    .nav-drawer-mode-label{display:flex;align-items:center;gap:10px;}
    .nav-drawer-mode-icon{width:20px;height:20px;border-radius:50%;background:var(--md-gold);opacity:0.85;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#111;}
    .nav-links{display:none;}
    .dark-toggle{background:none;border:1.5px solid var(--border);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:0.76rem;font-weight:500;color:var(--fg2);transition:all 0.2s;font-family:var(--sans);min-height:36px;}
    .dark-toggle:hover{border-color:var(--accent);color:var(--accent);}
    section{padding:var(--section-py) var(--px);scroll-margin-top:calc(var(--nav-h) + 12px);}
    .section-label{font-size:0.7rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:10px;}

    .section-title em{font-style:italic;color:var(--accent);}
    .hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(var(--nav-h) + 40px) var(--px) 56px;position:relative;overflow:hidden;}
    .hero-deco{position:absolute;top:120px;right:-50px;width:min(100px,24vw);height:min(100px,24vw);pointer-events:none;opacity:0.45;border-radius:50%;overflow:hidden;}
    .hero-eyebrow{font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;animation:fadeUp 0.6s ease both;animation-delay:0.1s;}
    .hero h1{animation:fadeUp 0.7s ease both;animation-delay:0.2s;}
    .hero-sub{animation:fadeUp 0.7s ease both;animation-delay:0.35s;}
    .hero-ctas{animation:fadeUp 0.6s ease both;animation-delay:0.5s;}
    .hero-stats{animation:fadeIn 0.8s ease both;animation-delay:0.65s;}
    .hero h1{font-family:var(--serif);font-size:clamp(2.6rem,9vw,6.8rem);line-height:1.04;letter-spacing:-0.02em;text-wrap:balance;}
    .hero h1 em{font-style:italic;color:var(--accent);}
    .hero-sub{margin-top:24px;font-size:0.98rem;color:var(--fg2);line-height:1.75;}
    .hero-ctas{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap;}
    .hero-stats{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:24px 32px;padding-top:36px;border-top:1px solid var(--border);}
    .stat-num{font-family:var(--serif);font-size:2rem;line-height:1;}
    .stat-num span{color:var(--accent);}
    .hero-stats>div{position:relative;padding-bottom:12px;}
    .hero-stats>div::after{content:'';position:absolute;bottom:0;left:0;width:24px;height:1.5px;background:var(--accent);opacity:0.45;}
    .stat-label{margin-top:4px;font-size:0.7rem;font-weight:500;letter-spacing:0.04em;color:var(--fg2);text-transform:uppercase;}
    .btn-primary{display:inline-flex;align-items:center;justify-content:center;background:var(--cta);color:white;padding:14px 24px;border-radius:4px;font-size:0.88rem;font-weight:600;border:none;cursor:pointer;font-family:var(--sans);min-height:44px;transition:background 0.2s,transform 0.2s;text-decoration:none;}
    .btn-primary:hover{background:var(--cta-hover);transform:translateY(-1px);}
    .btn-secondary{display:inline-flex;align-items:center;justify-content:center;background:none;color:var(--fg);padding:14px 24px;border-radius:4px;font-size:0.88rem;font-weight:500;border:1.5px solid var(--border);cursor:pointer;font-family:var(--sans);min-height:44px;transition:border-color 0.2s;text-decoration:none;}

    .about-grid{display:flex;flex-direction:column;align-items:center;gap:40px;margin-top:48px;}
    .about-photo{width:77px;height:77px;border-radius:50%;overflow:hidden;flex-shrink:0;}
    .about-text p{color:var(--fg2);line-height:1.8;font-size:0.97rem;margin-bottom:18px;}
    .about-text p strong{color:var(--fg);font-weight:600;}
    .about-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;}
    .tag{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent);padding:6px 12px;border-radius:99px;font-size:0.74rem;font-weight:600;}
    .skills-section{background:var(--bg2);}
    .skills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:48px;}
    .skill-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:16px;transition:border-color 0.2s,box-shadow 0.2s,transform 0.2s;}
    .skill-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,0.08);transform:translateY(-2px);}
    .skill-card-title{font-weight:600;font-size:0.92rem;margin-bottom:6px;}
    .skill-card-sub{font-size:0.78rem;color:var(--fg2);line-height:1.6;margin-bottom:20px;}
    .skill-arc-wrap{display:flex;align-items:center;gap:12px;margin-top:16px;}
    .skill-arc-svg{flex-shrink:0;}

    .skill-arc-fill{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(0.4,0,0.2,1);}
    .skill-level{font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);}
    .jtc-stack-wrap{margin-top:48px;}
    .jtc-stack-header{display:grid;grid-template-columns:1fr auto;align-items:end;gap:1rem;border-bottom:1px solid var(--border);padding-bottom:1.25rem;margin-bottom:1.5rem;}
    .jtc-stack-eyebrow{font-family:var(--mono);font-size:0.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fg2);margin:0 0 .4rem;}
    .jtc-stack-title{font-family:var(--serif);font-size:clamp(1.5rem,4vw,2.2rem);font-weight:400;line-height:1;color:var(--fg);margin:0;}
    .jtc-stack-title em{font-style:italic;color:var(--accent);}
    .jtc-count{font-family:var(--mono);font-size:2.8rem;font-weight:300;color:var(--border);line-height:1;letter-spacing:-.05em;transition:color .3s ease;}
    .jtc-filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.5rem;list-style:none;padding:0;}
    .jtc-filter-btn{background:transparent;border:1px solid var(--border);border-radius:2px;padding:.25rem .7rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--fg2);cursor:pointer;transition:background .18s ease,border-color .18s ease,color .18s ease;line-height:1.6;}
    .jtc-filter-btn:hover{background:var(--fg);border-color:var(--fg);color:var(--bg);}
    .jtc-filter-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
    .jtc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);}
    .jtc-card{background:var(--card);padding:1.25rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.4rem;position:relative;overflow:hidden;cursor:default;animation:jtcFadeUp .4s cubic-bezier(.22,.68,0,1.2) both;transition:transform .18s cubic-bezier(.22,.68,0,1.2);}
    .jtc-card::before{content:'';position:absolute;inset:0;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform .25s cubic-bezier(.22,.68,0,1.2);z-index:0;}
    .jtc-card:hover::before{transform:scaleY(1);}
    .jtc-card:hover{transform:translateY(-2px);}
    .jtc-card>*{position:relative;z-index:1;}
    .jtc-cat{font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--fg2);transition:color .18s ease;margin:0;}
    .jtc-name{font-family:var(--serif);font-size:1.05rem;line-height:1.2;color:var(--fg);transition:color .18s ease;margin:0;}
    .jtc-card:hover .jtc-cat,.jtc-card:hover .jtc-name{color:#fff;}
    .jtc-card[data-badge]::after{content:attr(data-badge);position:absolute;top:.7rem;right:.7rem;font-family:var(--mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:#fff;padding:.1rem .35rem;border-radius:1px;z-index:2;transition:opacity .2s ease;}
    .jtc-card[data-badge="new"]::after{background:var(--md-red);}
    .jtc-card[data-badge]:hover::after{opacity:0;}
    .jtc-card--wide{grid-column:span 2;flex-direction:row;align-items:center;justify-content:space-between;padding:1.4rem 1.25rem;}
    .jtc-card--wide .jtc-name{font-size:1.25rem;}
    .jtc-arrow{font-size:1.4rem;color:var(--border);transition:color .18s ease,transform .2s cubic-bezier(.22,.68,0,1.2);flex-shrink:0;margin-left:1rem;}
    .jtc-card--wide:hover .jtc-arrow{color:rgba(255,255,255,.5);transform:translateX(5px);}
    .jtc-card--hidden{display:none!important;}
    .jtc-legend{margin-top:1.5rem;display:flex;gap:1.25rem;flex-wrap:wrap;list-style:none;padding:0;}
    .jtc-legend li{display:flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.56rem;letter-spacing:.13em;text-transform:uppercase;color:var(--fg2);}

    @keyframes jtcFadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    .jtc-card:nth-child(1){animation-delay:.03s;}.jtc-card:nth-child(2){animation-delay:.06s;}.jtc-card:nth-child(3){animation-delay:.09s;}.jtc-card:nth-child(4){animation-delay:.12s;}.jtc-card:nth-child(5){animation-delay:.15s;}.jtc-card:nth-child(6){animation-delay:.18s;}.jtc-card:nth-child(7){animation-delay:.21s;}.jtc-card:nth-child(8){animation-delay:.24s;}.jtc-card:nth-child(9){animation-delay:.27s;}.jtc-card:nth-child(10){animation-delay:.30s;}.jtc-card:nth-child(11){animation-delay:.33s;}.jtc-card:nth-child(12){animation-delay:.36s;}.jtc-card:nth-child(13){animation-delay:.39s;}.jtc-card:nth-child(14){animation-delay:.42s;}.jtc-card:nth-child(15){animation-delay:.45s;}

<script>
  /* Mobile drawer keyboard support: Escape closes, focus moves in on open / back on close, Tab is trapped while open. */
  (function(){
    var getDrawer=function(){return document.getElementById('mobile-nav-drawer');};
    var getBurger=function(){return document.querySelector('button[aria-controls="mobile-nav-drawer"]');};
    document.addEventListener('keydown',function(e){
      var d=getDrawer(),b=getBurger();
      if(!d||!b||b.getAttribute('aria-expanded')!=='true')return;
      if(e.key==='Escape'){b.click();b.focus();return;}
      if(e.key==='Tab'){
        var f=d.querySelectorAll('a[href],button');
        if(!f.length)return;
        var first=f[0],last=f[f.length-1],a=document.activeElement;
        if(e.shiftKey&&(a===first||!d.contains(a))){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&(a===last||!d.contains(a))){e.preventDefault();first.focus();}
      }
    });
    var arm=function(){
      var b=getBurger();
      if(!b){setTimeout(arm,300);return;}
      new MutationObserver(function(){
        var d=getDrawer();
        if(b.getAttribute('aria-expanded')==='true'&&d){
          var f=d.querySelector('a[href],button');
          if(f)setTimeout(function(){f.focus();},60);
        }
      }).observe(b,{attributes:true,attributeFilter:['aria-expanded']});
    };
    arm();
  })();
  </script>

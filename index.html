  <style>
    /* ── RESET & TOKENS ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── ACCESSIBILITY ──────────────────────────────────────── */
    .sr-only {

    /* ── BASE ───────────────────────────────────────────────── */
    html { scroll-behavior: smooth; }

    /* ── SHARED SECTION STYLES ──────────────────────────────── */
    section { padding: var(--section-py) var(--px); }
    .section-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;

    /* ── HERO ───────────────────────────────────────────────── */
    .hero {

    .btn-primary {

    .jtc-legend li {
      display: flex; align-items: center; gap: .35rem; font-family: var(--mono);

    .jtc-card:nth-child(2)  { animation-delay: .06s; }
    .jtc-card:nth-child(3)  { animation-delay: .09s; }
    .jtc-card:nth-child(4)  { animation-delay: .12s; }
    .jtc-card:nth-child(5)  { animation-delay: .15s; }
    .jtc-card:nth-child(6)  { animation-delay: .18s; }
    .jtc-card:nth-child(7)  { animation-delay: .21s; }
    .jtc-card:nth-child(8)  { animation-delay: .24s; }
    .jtc-card:nth-child(9)  { animation-delay: .27s; }
    .jtc-card:nth-child(10) { animation-delay: .30s; }
    .jtc-card:nth-child(11) { animation-delay: .33s; }
    .jtc-card:nth-child(12) { animation-delay: .36s; }
    .jtc-card:nth-child(13) { animation-delay: .39s; }
    .jtc-card:nth-child(14) { animation-delay: .42s; }

      .jtc-card--wide { grid-column: span 1; flex-direction: column; align-items: flex-start; }
      .jtc-arrow { display: none; }

    /* ── PROJECTS ───────────────────────────────────────────── */
    .projects-grid { display: flex; flex-direction: column; gap: 1px; margin-top: 48px; }
    .project-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.3s; position: relative;
    }
    .project-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1); z-index: 1; border-radius: 4px 0 0 4px;
    }
    .project-card[data-accent="gold"]::before  { background: var(--md-gold); }
    .project-card[data-accent="red"]::before   { background: var(--md-red); }
    .project-card[data-accent="navy"]::before  { background: var(--md-navy); }
    .project-card.expanded::before { width: 3px; }
    .project-card.expanded { border-color: var(--accent); box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .project-card:hover { border-color: var(--accent); }
    .project-header:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 4px; }
    .project-header {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px;
      padding: 24px 20px 24px 24px; cursor: pointer; position: relative; transition: background 0.2s;
    }
    .project-header:hover { background: rgba(0,0,0,0.015); }
    [data-dark="true"] .project-header:hover { background: rgba(255,255,255,0.02); }
    .project-index {
      position: absolute; right: 60px; top: 50%; transform: translateY(-50%);
      font-family: var(--serif); font-size: 5rem; font-weight: 700;
      color: var(--fg); opacity: 0.035; line-height: 1; pointer-events: none;
      user-select: none; transition: opacity 0.3s;
    }
    .project-card:hover .project-index, .project-card.expanded .project-index { opacity: 0.06; }
    .project-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .project-meta-chip {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-light);
      padding: 2px 7px; border-radius: 2px; border: 1px solid transparent;
      transition: border-color 0.2s, letter-spacing 0.2s;
    }
    .project-header:hover .project-meta-chip { letter-spacing: 0.12em; border-color: var(--accent); }
    .project-title { font-family: var(--serif); font-size: 1.3rem; letter-spacing: -0.01em; line-height: 1.2; }
    .project-tagline {
      margin-top: 6px; font-size: 0.84rem; color: var(--fg2);
      display: inline-block; position: relative;
    }
    .project-tagline::after {
      content: ''; position: absolute; bottom: -2px; left: 0;
      height: 1px; width: 0; background: var(--accent);
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .project-header:hover .project-tagline::after { width: 100%; }
    .project-toggle {
      width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--fg2); transition: border-color 0.2s, color 0.2s, background 0.2s; flex-shrink: 0;
      min-width: 36px; z-index: 2;
    }
    .project-toggle svg { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    .project-card.expanded .project-toggle svg { transform: rotate(180deg); }
    .project-card:hover .project-toggle, .project-card.expanded .project-toggle { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .project-body {
      border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr;
      overflow: hidden; max-height: 0;
      transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .project-body.open { max-height: 1200px; }
    .project-details { padding: 28px 24px; border-bottom: 1px solid var(--border); position: relative; }
    .pbl-steps-wrap { position: relative; }
    .pbl-steps-wrap::before {
      content: ''; position: absolute; left: 12px; top: 14px; width: 1px; bottom: 28px;
      background: linear-gradient(to bottom, var(--accent) 0%, transparent 100%); opacity: 0.25;
    }
    .pbl-step { display: flex; gap: 14px; margin-bottom: 22px; align-items: flex-start; }
    .pbl-step:last-child { margin-bottom: 0; }
    .pbl-num {
      width: 26px; height: 26px; border-radius: 50%; background: var(--accent-light); color: var(--accent);
      border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 700; flex-shrink: 0; margin-top: 1px;
      position: relative; z-index: 1; transition: background 0.2s, transform 0.2s;
    }
    .pbl-step:hover .pbl-num { background: var(--accent); color: var(--card); transform: scale(1.1); }
    .pbl-label { font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; opacity: 0.8; }
    .pbl-text { font-size: 0.86rem; color: var(--fg); line-height: 1.65; }
    .project-demo { padding: 24px 20px; background: var(--bg2); }
    .demo-label {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--fg2); margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .demo-label::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--accent); opacity: 0.6; }

    /* ── WORKFLOW DEMO ───────────────────────────────────────── */
    @keyframes wf-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent); opacity: 1; }
      50%       { box-shadow: 0 0 0 4px transparent; opacity: 0.7; }

    .wf-nodes { display: flex; flex-direction: column; gap: 8px; }
    .wf-node {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 4px; padding: 10px 14px;
      transition: border-color 0.35s, background 0.35s, transform 0.2s;

    .wf-node.lit { border-color: var(--accent); background: var(--accent-light); transform: translateX(2px); }

    .wf-node-text { font-size: 0.8rem; font-weight: 500; }

    .wf-btn {
      margin-top: 14px; background: var(--cta); color: white;
      border: none; border-radius: 4px; padding: 10px 18px;
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
      font-family: var(--sans); transition: background 0.2s; min-height: 44px;

    .wf-btn:hover { background: var(--cta-hover); }

    /* ── CHART DEMO ─────────────────────────────────────────── */
    .chart-wrap { position: relative; height: 180px; }

    /* ── GAME DEMO ──────────────────────────────────────────── */
    .game-q { font-size: 0.88rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }

      background: var(--card); border: 1.5px solid var(--border); border-left-width: 3px;

    .game-opt:hover:not(:disabled) { border-color: var(--border); border-left-color: var(--accent); transform: translateX(2px); }
    .game-opt.correct { border-color: #22c55e; background: #DCFCE7; color: #166534; }
    .game-opt.wrong   { border-color: #ef4444; background: #FEE2E2; color: #991b1b; }
    .game-feedback { font-size: 0.82rem; margin-top: 10px; font-weight: 500; min-height: 20px; }

    /* ── TESTIMONIALS ───────────────────────────────────────── */
    .testimonials-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 48px; }
    .testimonial-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 4px; padding: 28px 24px; border-left: 3px solid var(--accent);
      transition: box-shadow 0.2s;
    }
    .testimonial-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); }
    .t-quote { font-size: 2.8rem; color: var(--accent); font-family: var(--serif); line-height: 0.8; margin-bottom: 16px; opacity: 0.7; }
    .t-text { font-size: 0.9rem; line-height: 1.75; color: var(--fg); margin-bottom: 24px; }
    .t-author { display: flex; align-items: center; gap: 12px; }
    .t-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.82rem; color: var(--accent); flex-shrink: 0;

    .t-name { font-weight: 600; font-size: 0.86rem; }
    .t-role { font-size: 0.73rem; color: var(--fg2); margin-top: 2px; }
    .t-read-more {
      display: inline-block; font-size: 0.82rem; font-weight: 600; color: var(--accent);
      text-decoration: none; white-space: nowrap; transition: color 0.2s, letter-spacing 0.2s;
    }
    .t-read-more:hover { color: var(--cta); letter-spacing: 0.01em; }

    /* ── CREDENTIALS ────────────────────────────────────────── */
    .creds-section { background: var(--bg2); }
    .creds-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 48px; }
    .cred-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 22px 24px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      display: flex; gap: 20px; align-items: flex-start; position: relative; overflow: hidden;
    }
    .cred-card::after {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      background: var(--md-gold); transition: width 0.25s ease;
    }
    .cred-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .cred-card:hover::after { width: 3px; }
    .cred-icon { width: 56px; height: 56px; flex-shrink: 0; border-radius: 8px; background: var(--bg2); padding: 4px; border: 1px solid var(--border); display: block; line-height: 0; }
    .cred-issuer { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .cred-name { font-weight: 600; font-size: 0.9rem; line-height: 1.4; }

    /* ── CONTACT ────────────────────────────────────────────── */
    .contact-section { text-align: center; padding: 80px var(--px); }
    .contact-section .section-title { margin: 0 auto 20px; }
    .contact-sub { font-size: 0.95rem; color: var(--fg2); max-width: 480px; margin: 0 auto 40px; line-height: 1.7; }
    .contact-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer {
      border-top: 2px solid var(--accent); padding: 28px var(--px);
      display: flex; flex-direction: column; gap: 12px;
      align-items: center; text-align: center; font-size: 0.76rem; color: var(--fg2);
    }
    .footer-links { display: flex; gap: 20px; }
    footer a:hover { color: var(--accent); }

    /* ── TWEAKS PANEL ───────────────────────────────────────── */
    .tweaks-panel {
      position: fixed; bottom: 16px; right: 16px; width: 260px;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 18px; z-index: 400;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: none;
    }
    .tweaks-panel.visible { display: block; }
    .tweaks-title { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; color: var(--fg); }
    .tweak-row { margin-bottom: 12px; }
    .tweak-label { font-size: 0.73rem; font-weight: 600; color: var(--fg2); margin-bottom: 5px; }

    .tweak-slider { width: 100%; accent-color: var(--accent); }

    /* ── THEME PILL (mobile-first floating color switcher) ──── */

      Mobile: fixed bottom-left pill, 3 color dots + label
      Tablet+: collapses to subtle icon-only ring

    .theme-pill {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 16px;
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 6px;

      user-select: none;
      line-height: 1;

    .theme-pill-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    /* Each dot is a button for a11y */
    .theme-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s cubic-bezier(0.22,0.68,0,1.2),
                  border-color 0.18s ease,
                  box-shadow 0.18s ease;
      min-width: 20px;
      min-height: 20px; /* tap target via pill padding */
      position: relative;
    }
    .theme-dot:hover { transform: scale(1.18); }
    .theme-dot.active {
      border-color: var(--fg);
      transform: scale(1.22);
      box-shadow: 0 0 0 1px var(--bg), 0 0 0 3px var(--fg);
    }
    .theme-dot[data-scheme="gold"]  { background: #F0A500; }
    .theme-dot[data-scheme="red"]   { background: #CE1126; }
    .theme-dot[data-scheme="navy"]  { background: #1E3A5F; }

    /* Checkmark inside active dot */
    .theme-dot.active::after {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
    }

    /* On desktop hide the pill label to save space */
    @media (min-width: 768px) {
      .theme-pill {
        padding: 7px 10px;
      }
      .theme-pill-label { display: none; }
    }

    /* If tweaks panel is visible (edit mode), shift pill up */
    .theme-pill--shifted {
      bottom: max(170px, calc(env(safe-area-inset-bottom, 0px) + 170px));
    }

    @media (prefers-reduced-motion: reduce) {
      .theme-dot, .theme-pill { transition: none; }
    }

    /* ── DESKTOP ────────────────────────────────────────────── */
    @media (min-width: 768px) {
      :root { --px: 48px; --section-py: 112px; --nav-h: 64px; }
      .hamburger { display: none; }
      .nav-drawer { display: none; }

        font-size: 0.8rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;

      .about-grid { flex-direction: row; align-items: flex-start; gap: 64px; }

      .creds-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      footer { flex-direction: row; justify-content: space-between; text-align: left; }
    }
    @media (min-width: 1024px) {
      .skills-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | John Crawford</title>
  <style>
    :root{--bg:#F7F4EE;--fg:#111111;--fg2:#4A4035;--accent:#B87D00;--cta:#CE1126}
    @media (prefers-color-scheme: dark){:root{--bg:#0F1B2D;--fg:#F7F4EE;--fg2:#B8AC9C;--accent:#F0A500}}
    body{background:var(--bg);color:var(--fg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.7;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
    main{max-width:480px;text-align:center}
    h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:2rem;margin:0 0 8px}
    .code{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700}
    p{color:var(--fg2)}
    a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 28px;margin-top:12px;background:var(--cta);color:#fff;text-decoration:none;border-radius:6px;font-weight:600}
    a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <div class="code">404 · Page not found</div>
    <h1>This page drifted out with the tide.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to shore.</p>
    <a class="btn" href="/">Back to the homepage</a>
  </main>
</body>
</html>

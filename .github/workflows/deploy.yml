name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" "${{ secrets.DEPLOY_URL }}?key=${{ secrets.DEPLOY_SECRET }}")
          cat response.txt
          if [ "$status" != "200" ]; then
            echo "Deploy webhook returned HTTP $status"
            exit 1
          fi
